<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Co-Néctar · Miel artesanal mexicana</title>
<meta name="description" content="Co-Néctar: miel artesanal mexicana de Puebla, Oaxaca y Veracruz, directo del apiario a tu cocina. Empresa social con fondo crediticio para apicultores.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #fbf6ec;
  --cream-2: #f4ead6;
  --ink: #2a1f14;
  --ink-soft: #5b4a38;
  --honey: #e0a43a;
  --honey-deep: #9a6410;
  --brown: #3b2a18;
  --line: #e6d8bd;
  --radius: 14px;
  --display: "Fraunces", Georgia, serif;
  --body: "Work Sans", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; }
h1, h2, h3 { font-family: var(--display); line-height: 1.12; margin: 0 0 .5em; font-weight: 600; }
h1 { font-size: clamp(2.4rem, 6vw, 4.4rem); letter-spacing: -.02em; }
h2 { font-size: clamp(1.9rem, 4vw, 2.9rem); letter-spacing: -.01em; margin-bottom: .8em; }
h3 { font-size: 1.3rem; }
p { margin: 0 0 1em; }
a { color: var(--honey-deep); }

.wrap { width: min(1160px, 100% - 32px); margin-inline: auto; }

.eyebrow {
  font-size: .8rem;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--honey-deep);
  margin-bottom: 1rem;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 48px; padding: 0 26px;
  border-radius: 999px;
  background: var(--ink); color: var(--cream);
  font-weight: 600; text-decoration: none;
  border: 2px solid var(--ink);
  transition: transform .15s, background .15s, color .15s;
}
.btn:hover { transform: translateY(-2px); background: var(--brown); }
.btn--ghost { background: transparent; color: var(--ink); }
.btn--ghost:hover { background: var(--ink); color: var(--cream); }
.btn--ghost-light { background: transparent; color: var(--cream); border-color: var(--cream); }
.btn--ghost-light:hover { background: var(--cream); color: var(--ink); }
.btn--small { min-height: 40px; padding: 0 18px; }

/* Nav */
.nav {
  position: sticky; top: 0; z-index: 10;
  background: rgba(251, 246, 236, .92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.nav__inner { display: flex; align-items: center; justify-content: space-between; height: 68px; }
.logo {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--display); font-weight: 700; font-size: 1.35rem;
  color: var(--ink); text-decoration: none;
}
.logo svg { color: var(--honey-deep); }
.
